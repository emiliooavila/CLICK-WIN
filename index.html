<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click &amp; Win</title>
  <link rel="icon" type="image/png" href="/CLICK&WIN-FAVICON.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Raleway:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <div class="casino-bg">
    <div id="particles"></div>

    <!-- Header bienvenida con logo -->
    <header class="cw-header">
      <img src="/CLICK&WIN-LOGO-HEADER.jpg" alt="Click & Win" class="cw-logo" />
    </header>

    <!-- Máquina de slots -->
    <div class="slot-wrapper">
      <div class="slot-machine">
        <div class="slot-reel" id="reel0">🎁</div>
        <div class="slot-divider">|</div>
        <div class="slot-reel" id="reel1">🎀</div>
        <div class="slot-divider">|</div>
        <div class="slot-reel" id="reel2">⭐</div>
      </div>
    </div>

    <!-- Card central -->
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
          <div class="welcome-card">
            <h1 class="welcome-title">Click <span>&amp;</span> Win</h1>
            <p class="welcome-sub">
              El organizador de sorteos de regalos más elegante
              para tus celebraciones
            </p>

            <ul class="feature-list">
              <li><i class="bi bi-shuffle"></i> Sorteo automático y justo</li>
              <li><i class="bi bi-slash-circle"></i> Exclusiones personalizadas</li>
              <li><i class="bi bi-device-hdd"></i> Datos guardados en tu dispositivo</li>
              <li><i class="bi bi-phone"></i> Funciona en cualquier pantalla</li>
            </ul>

            <p class="credit">
              Proyecto universitario · Emilio Avila &amp; Diego Delgado
            </p>

            <button class="btn-start" id="btnStart">
              Comenzar sorteo
              <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="toastZone" class="toast-zone"></div>
  <script type="module" src="/js/welcome.ts"></script>
</body>
</html>

<body>

  <div id="appHeader"></div>

  <main class="app-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">


          <div class="card-panel">
            <h3 class="card-title">¿Quieres excluir ciertos sorteos?</h3>
            <p class="card-sub">
              Evita que ciertas personas saquen nombres específicos.
            </p>

            <button class="btn-option" id="btnNoExcl">
              <i class="bi bi-x-circle"></i> No establecer exclusiones
            </button>
            <button class="btn-option" id="btnYesExcl">
              <i class="bi bi-sliders"></i> Establecer exclusiones
            </button>

            <div id="exclusionsList" style="display:none; margin-top:18px;"></div>

            <div class="nav-row">
              <button class="btn-secondary" id="btnBack">
                <i class="bi bi-arrow-left"></i>
              </button>
              <button class="btn-primary" id="btnContinue">
                Continuar <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="exclModal" style="display:none;">
    <div class="modal-box">
      <h4 id="exclModalTitle"></h4>
      <ul class="excl-check-list" id="exclCheckList"></ul>
      <div class="nav-row">
        <button class="btn-secondary" id="btnModalCancel">Cancelar</button>
        <button class="btn-primary"   id="btnModalSave">Hecho</button>
      </div>
    </div>
  </div>

  <div id="toastZone" class="toast-zone"></div>

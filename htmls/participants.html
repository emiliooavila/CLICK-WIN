<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Participantes – Click &amp; Win</title>
  <link rel="icon" type="image/png" href="/CLICK-WIN/CLICKWIN-FAVICON.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Raleway:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <script type="module" crossorigin src="/CLICK-WIN/assets/participants-dzqB34Jd.js"></script>
  <link rel="modulepreload" crossorigin href="/CLICK-WIN/assets/storage-CiY_4-N5.js">
  <link rel="modulepreload" crossorigin href="/CLICK-WIN/assets/participants-B5UWuJ86.js">
  <link rel="modulepreload" crossorigin href="/CLICK-WIN/assets/header-BwN2pD5c.js">
  <link rel="stylesheet" crossorigin href="/CLICK-WIN/assets/storage-D4wgWwwc.css">
  <link rel="stylesheet" crossorigin href="/CLICK-WIN/assets/participants-wubsqelx.css">
</head>
<body>

  <div id="appHeader"></div>

  <main class="app-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

          <div class="screen-title">Participantes</div>
          <p class="screen-sub">
            Agrega a todos los que participan. Arrastra para reordenar.
          </p>

          <div class="card-panel tw-p-6">

            <label class="field-label">¿Con quién vas a sortear nombres?</label>
            <p class="drag-hint">
              <i class="bi bi-grip-vertical"></i>
              Arrastra las tarjetas para reordenar
            </p>

            <ul class="participants-list" id="participantsList"></ul>
            
            <div class="add-row tw-mt-2">
              <input
                type="text"
                id="newName"
                class="field-input"
                placeholder="Añadir nombre"
                maxlength="50"
                autocomplete="off"
              />
              <button class="btn-icon" id="btnAdd" aria-label="Agregar">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>

            <div class="nav-row tw-mt-6">
              <button class="btn-secondary" id="btnBack">
                <i class="bi bi-arrow-left"></i>
              </button>
              <button class="btn-primary" id="btnContinue">
                Continuar <i class="bi bi-arrow-right"></i>
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toastZone" class="toast-zone"></div>
</body>
</html>

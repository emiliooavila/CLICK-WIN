<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipo de Evento – Click &amp; Win</title>
  <link rel="icon" type="image/png" href="/CLICK-WIN/CLICKWIN-FAVICON.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Raleway:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <script type="module" crossorigin src="/CLICK-WIN/assets/eventType-niumw828.js"></script>
  <link rel="modulepreload" crossorigin href="/CLICK-WIN/assets/storage-CiY_4-N5.js">
  <link rel="modulepreload" crossorigin href="/CLICK-WIN/assets/header-Dfc8t_b7.js">
  <link rel="stylesheet" crossorigin href="/CLICK-WIN/assets/storage-D4wgWwwc.css">
  <link rel="stylesheet" crossorigin href="/CLICK-WIN/assets/eventType-DbDwUJT-.css">
</head>
<body>

  <div id="appHeader"></div>

  <main class="app-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

          <div class="card-panel">
            <h3 class="card-title">¿Para qué vas a sortear nombres?</h3>

            <div class="row g-2" id="eventTypeGrid">
              <div class="col-6">
                <button class="btn-chip tw-w-full" data-type="Día de San Valentín">
                  San Valentín
                </button>
              </div>
              <div class="col-6">
                <button class="btn-chip tw-w-full" data-type="Intercambio">
                  Intercambio
                </button>
              </div>
              <div class="col-6">
                <button class="btn-chip tw-w-full" data-type="Navidad">
                  Navidad
                </button>
              </div>
              <div class="col-6">
                <button class="btn-chip tw-w-full" data-type="Día del Niño">
                  Día del Niño
                </button>
              </div>
              <div class="col-12">
                <button class="btn-chip tw-w-full" data-type="Día de la Madre">
                  Día de la Madre
                </button>
              </div>
            </div>

            <button class="btn-link-green" id="btnShowMore">Mostrar más</button>

            <div id="moreTypes" style="display:none;" class="mt-2">
              <div class="row g-2">
                <div class="col-6">
                  <button class="btn-chip tw-w-full" data-type="Cumpleaños">
                    Cumpleaños
                  </button>
                </div>
                <div class="col-6">
                  <button class="btn-chip tw-w-full" data-type="Graduación">
                    Graduación
                  </button>
                </div>
                <div class="col-6">
                  <button class="btn-chip tw-w-full" data-type="Aniversario">
                    Aniversario
                  </button>
                </div>
                <div class="col-6">
                  <button class="btn-chip tw-w-full" data-type="Halloween">
                    Halloween
                  </button>
                </div>
                <div class="col-12">
                  <button class="btn-chip tw-w-full" data-type="Otro">
                     Otro
                  </button>
                </div>
              </div>
            </div>

            <div id="eventNameWrap" style="display:none;" class="mt-3">
              <label class="field-label" for="eventName">
                Nombre de la celebración
              </label>
              <div class="input-wrap">
                <input
                  type="text"
                  id="eventName"
                  class="field-input"
                  placeholder="Ej. Intercambio 2026"
                  maxlength="60"
                  autocomplete="off"
                />
                <button class="clear-btn" id="btnClearEvent">×</button>
              </div>
            </div>

            <div class="nav-row">
              <button class="btn-secondary" id="btnBack">
                <i class="bi bi-arrow-left"></i>
              </button>
              <button class="btn-primary" id="btnContinue">
                Continuar <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="toastZone" class="toast-zone"></div>
</body>
</html>
